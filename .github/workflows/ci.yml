name: CI
run-name: >-
  Deploy ${{ github.event.client_payload.host }}
  ${{ github.event.client_payload.requestId }}

on:
  repository_dispatch:
    types: [fleet-deploy]

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.event.client_payload.requestId }}
  cancel-in-progress: false

jobs:
  request:
    name: Verify deployment request
    runs-on: ubuntu-24.04
    outputs:
      host: ${{ steps.request.outputs.host }}
      project: ${{ steps.request.outputs.project }}
      source-job: ${{ steps.request.outputs.source-job }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/github-script@v9
        id: request
        env:
          REQUEST: ${{ toJSON(github.event.client_payload) }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/ci/request.mjs`
            );
            await run({ github, context, core });

  approve:
    name: Approve / ${{ needs.request.outputs.host }}
    needs: request
    runs-on: ubuntu-24.04
    environment:
      name: deploy-${{ needs.request.outputs.host }}
    concurrency:
      group: deploy-${{ needs.request.outputs.host }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      job: ${{ steps.approve.outputs.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/github-script@v9
        id: approve
        env:
          HERCULES_CI_API_TOKEN: ${{ secrets.HERCULES_CI_API_TOKEN }}
          PROJECT: ${{ needs.request.outputs.project }}
          REQUEST: ${{ toJSON(github.event.client_payload) }}
          SOURCE_JOB: ${{ needs.request.outputs.source-job }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/ci/approve.mjs`
            );
            await run({ github, context, core });

  observe:
    name: Deployment result / ${{ needs.request.outputs.host }}
    needs: [request, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/github-script@v9
        env:
          JOB: ${{ needs.approve.outputs.job }}
          SOURCE_JOB: ${{ needs.request.outputs.source-job }}
        with:
          script: |
            const { default: run } = await import(
              `${process.env.GITHUB_WORKSPACE}/ci/observe.mjs`
            );
            await run({ github, context, core });
